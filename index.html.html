<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>طلب انتساب أولي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Tajawal", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102,126,234,0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    .success {
      margin-top: 10px;
      color: green;
      display: none;
    }

  </style>
</head>

<body>

<div class="container">
  <h2>طلب انتساب أولي لحزب العدالة و الاعمار فرع القنيطرة - الفرقة الثانية - الشعبة الرابعة </h2>

  <form id="form">
    <input name="name" placeholder="الاسم الثلاثي" required>
    <input name="birth" placeholder="مكان وتاريخ الولادة" required>
    <input name="address" placeholder="العنوان الحالي" required>
    <input name="phone" placeholder="رقم الهاتف" required>
    <input name="email" type="email" placeholder="البريد الإلكتروني" required>
    <input name="job" placeholder="المستوى العلمي / المهنة" required>

    <button type="submit">إرسال الطلب</button>
  </form>

  <p class="success" id="msg">تم إرسال الطلب بنجاح 💙</p>
</div>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  fetch("https://sheetdb.io/api/v1/wb9wn52xepsec", {
    method: "POST",
    body: new FormData(this)
  }).then(() => {
    document.getElementById("msg").style.display = "block";
    this.reset();
  }).catch(() => alert("صار خطأ 😢"));
});
</script>

</body>
</html>
